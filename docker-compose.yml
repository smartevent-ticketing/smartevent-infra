services:
  postgres:
    image: postgres:16
    container_name: smart_event_postgres
    environment:
      POSTGRES_DB: smart_event
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tdhuy0909
    ports:
      - "5432:5432"
    volumes:
      - smart_event_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: smart_event_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: smart_event_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio
    container_name: smart_event_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - smart_event_minio_data:/data

volumes:
  smart_event_postgres_data:
  smart_event_minio_data: