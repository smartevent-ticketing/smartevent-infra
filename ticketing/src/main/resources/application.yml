server:
  port: 8080

spring:
  config:
    import:
      - optional:classpath:application-jwt.yml


  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000ms
          max-attempts: 3
          multiplier: 2
        default-requeue-rejected: false

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:smartevent.ticketing@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:your_app_password}
    test-connection: false
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

app:
  payment:
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:DEMOVNPAY}
      hash-secret: ${VNPAY_HASH_SECRET:SECRETKEY123456789}
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay/return}
      ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/v1/payments/vnpay/ipn}
      version: "2.1.0"
      command: "pay"
    momo:
      partner-code: ${MOMO_PARTNER_CODE:MOMO}
      access-key: ${MOMO_ACCESS_KEY:F8BBA842ECF85}
      secret-key: ${MOMO_SECRET_KEY:K951B6PE1waDMi640xX0huZDAm&8fStatic}
      endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
      return-url: ${MOMO_RETURN_URL:http://localhost:8080/api/v1/payments/momo/return}
      ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/v1/payments/momo/ipn}
    zalopay:
      app-id: ${ZALOPAY_APP_ID:2553}
      key1: ${ZALOPAY_KEY1:PcY4iZIKrnbtLENg5BQvdEwDuKjvMwdu}
      key2: ${ZALOPAY_KEY2:kLtgPl8HHhfvMuY2tcKbgFn9pInnFUba}
      endpoint: ${ZALOPAY_ENDPOINT:https://sb-openapi.zalopay.vn/v2/create}
      callback-url: ${ZALOPAY_CALLBACK_URL:http://localhost:8080/api/v1/payments/zalopay/callback}
    paypal:
      client-id: ${PAYPAL_CLIENT_ID:YOUR_PAYPAL_CLIENT_ID}
      secret-key: ${PAYPAL_SECRET_KEY:YOUR_PAYPAL_SECRET_KEY}
      base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
      mode: sandbox
      return-url: ${PAYPAL_RETURN_URL:http://localhost:8080/api/v1/payments/paypal/success}
      cancel-url: ${PAYPAL_CANCEL_URL:http://localhost:8080/api/v1/payments/paypal/cancel}
  storage:
    minio:
      endpoint: ${APP_MINIO_ENDPOINT}
      access-key: ${APP_MINIO_ACCESS_KEY}
      secret-key: ${APP_MINIO_SECRET_KEY}
      bucket: ${APP_MINIO_BUCKET}
  date:
    default-format: "yyyy-MM-dd HH:mm:ss"
    timezone: "Asia/Ho_Chi_Minh"